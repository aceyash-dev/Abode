name: Nightly

# A prerelease APK built from main every few commits, so a runnable build exists
# without anyone tagging anything. It runs on pushes, not on a clock: a quiet day
# builds nothing, a busy one builds at most once per NIGHTLY_EVERY commits.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to create the release and the tag.
permissions:
  contents: write

# A slow build must not stack up behind the next push.
concurrency:
  group: nightly
  cancel-in-progress: true

env:
  # Build after this many commits since the last nightly. Change it here only.
  NIGHTLY_EVERY: 4

jobs:
  nightly:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Counts commits since the commit the newest nightly was built from. A manual
      # run always builds; so does a first run, or a history rewrite that makes the
      # old commit unreachable.
      - name: Decide whether to build
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          last="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq '[.[] | select(.tag_name | startswith("nightly-"))][0].target_commitish // empty' 2>/dev/null)"
          build=true
          count=0
          if [ "$EVENT" = "workflow_dispatch" ]; then
            reason="manual run"
          elif [ -z "$last" ] || ! git cat-file -e "${last}^{commit}" 2>/dev/null \
              || ! git merge-base --is-ancestor "$last" HEAD; then
            reason="no usable previous nightly"
          else
            count="$(git rev-list --count "$last..HEAD")"
            reason="$count commits since the last nightly"
            if [ "$count" -lt "$NIGHTLY_EVERY" ]; then build=false; fi
          fi
          echo "$reason; build=$build"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.gate.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.gate.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        if: steps.gate.outputs.build == 'true'
        run: gradle :engine-text:testDebugUnitTest -PgitSha=${{ github.sha }} --stacktrace

      - name: Build debug APK
        if: steps.gate.outputs.build == 'true'
        run: gradle :app:assembleDebug -PgitSha=${{ github.sha }} --stacktrace

      - name: Name the artefact
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%d)"
          sha="$(git rev-parse --short HEAD)"
          mkdir -p out
          # One file per ABI: a glob copy would fail outright now that the build
          # produces two APKs, and a single nightly for both is the fat build.
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
            "out/abode-nightly-${stamp}-${sha}-arm64-v8a.apk"
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk \
            "out/abode-nightly-${stamp}-${sha}-armeabi-v7a.apk"
          echo "TAG=nightly-${stamp}" >> "$GITHUB_ENV"
          echo "STAMP=${stamp}" >> "$GITHUB_ENV"

      # The artefact is kept either way, so a failed publish still leaves the
      # build downloadable from the run.
      - name: Upload build artefact
        if: steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: abode-nightly
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish prerelease
        if: steps.gate.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Re-running a day replaces that day's release rather than failing on an
          # existing tag. The new release is what the next gate measures from.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          subject="$(git log -1 --format=%s "$GITHUB_SHA")"
          note="Built from commit [${GITHUB_SHA:0:7}](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
          note="$note Full SHA: \`${GITHUB_SHA}\`"
          note="$note"$'\n\n'"Commit message: ${subject}"
          note="$note"$'\n\n'"Built by [run ${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) on $(date -u +%Y-%m-%d) UTC, after every ${NIGHTLY_EVERY} commits."
          note="$note"$'\n\n'"Debug-signed: uninstall any Play build before installing this one. Not a stable release: this is whatever main looked like when the build ran."
          gh release create "$TAG" out/*.apk \
            --title "Nightly $STAMP · ${GITHUB_SHA:0:7}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --notes "$note"
