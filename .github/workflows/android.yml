name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        run: gradle :engine-text:testDebugUnitTest -PgitSha=${{ github.sha }} --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug -PgitSha=${{ github.sha }} --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # The upload key comes from repository secrets, never from the repo. If the
      # secrets are not set, this step does nothing and the release build is skipped,
      # so the debug build keeps working for everyone else.
      - name: Decode release keystore
        id: release_key
        env:
          # Names as documented in docs/SIGNING.md.
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "Release signing secrets not set; skipping the release build."
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > keystore/release.p12
          {
            echo "storeFile=keystore/release.p12"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "release_ready=true" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        if: steps.release_key.outputs.release_ready == 'true'
        run: gradle :app:assembleRelease -PgitSha=${{ github.sha }} --stacktrace

      - name: Upload release APK
        if: steps.release_key.outputs.release_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
